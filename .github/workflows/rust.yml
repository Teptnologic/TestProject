name: Engine

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The shipped content must always load and every scenario must run.
      - run: cargo run --release -p arena-cli -- validate content/lol
      - run: |
          for scenario in scenarios/*.yaml; do
            cargo run --release -p arena-cli -- run "$scenario" --seed 1
          done
