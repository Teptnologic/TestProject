# Garen. Base stats, growth and cooldowns come from generated/units.yaml.
# The per-rank ability numbers below are written by hand (League of Legends
# Wiki) until the ingest tool extracts them from Riot's data.
# Not modelled yet: the Perseverance passive, W's permanent resist stacks and
# E's extra spins from attack speed.
id: garen
radius: 65
tags: [melee]
params:
  windup_pct: 0.18
constants:
  q_bonus: [30, 60, 90, 120, 150]
  q_speed_duration: [1, 1.65, 2.3, 2.95, 3.6]
  w_duration: [2, 2.75, 3.5, 4.25, 5]
  w_shield: [70, 95, 120, 145, 170]
  e_base: [4, 8, 12, 16, 20]
  e_ratio: [0.36, 0.37, 0.38, 0.39, 0.4]
  r_base: [150, 250, 350]
  r_missing: [0.25, 0.3, 0.35]
rank_priority: [E, Q, W]

actions:
  - id: garen_attack
    slot: A
    tags: [basic_attack]
    target: enemy
    range: attack_range
    lock_move: true
    cancel_on_move: true
    on_execute:
      - damage: { amount: ad, type: physical, tags: [basic_attack], crit: 1 }

  - id: garen_q
    slot: Q
    tags: [ability]
    max_rank: 5
    cooldown: "@q_cooldown[rank]"
    on_cast:
      - apply_buff: { buff: garen_q_empowered, to: source }
      - apply_buff: { buff: garen_q_speed, to: source, duration: "@q_speed_duration[rank]" }
      - reset_cooldown: { action: garen_attack }

  - id: garen_w
    slot: W
    tags: [ability]
    max_rank: 5
    cooldown: "@w_cooldown[rank]"
    on_cast:
      - apply_buff: { buff: garen_w_courage, to: source, duration: "@w_duration[rank]" }
      - shield: { to: source, amount: "@w_shield[rank] + 0.18 * bonus_max_hp", duration: 0.75 }

  - id: garen_e
    slot: E
    tags: [ability]
    max_rank: 5
    cooldown: "@e_cooldown[rank]"
    on_cast:
      - apply_buff: { buff: garen_e_spin, to: source }

  - id: garen_r
    slot: R
    tags: [ability, ultimate]
    max_rank: 3
    target: enemy
    range: "@r_range"
    cast_time: 0.435
    cooldown: "@r_cooldown[rank]"
    lock_move: true
    on_execute:
      - damage: { amount: "@r_base[rank] + @r_missing[rank] * target.missing_hp", type: "true" }

buffs:
  - id: garen_q_empowered
    duration: 4.5
    listeners:
      - on: on_hit
        consume: true
        effects:
          - damage: { amount: "@q_bonus[rank] + 0.5 * ad", type: physical, tags: [proc] }
          - silence: { duration: 1.5 }

  - id: garen_q_speed
    modifiers:
      - { stat: move_speed, layer: pct_add, value: 0.35 }

  - id: garen_w_courage
    modifiers:
      - { stat: damage_reduction, value: 0.3 }

  - id: garen_e_spin
    duration: 3
    flags: [disarmed]
    every: 0.4286
    on_tick:
      - area:
          center: source
          radius: "@e_range"
          effects:
            - damage: { amount: "@e_base[rank] + @e_ratio[rank] * ad", type: physical, tags: [aoe] }

ai:
  attack: A
  build: [berserkers_greaves, black_cleaver, dorans_blade, long_sword]
  rules:
    - { use: R, when: "@r_base[rank] + @r_missing[rank] * target.missing_hp >= target.hp" }
    - { use: Q, when: "distance < 600" }
    - { use: W, when: "distance < 400" }
    - { use: E, when: "distance < 300" }
