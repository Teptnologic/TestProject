# Sylas (assassin / mage fighter). Base stats, growth, cooldowns and ranges come from generated/units.yaml.
# Numbers marked "Riot data" come from src/data/generated/champion-details.json.
# Numbers marked "unverified" were filled in from memory of the kit and have not
# been checked against the game or the wiki.
# Simplified: R (Hijack) is left out, because copying another unit's ultimate
# needs engine support that does not exist yet. The passive stores one charge
# instead of three and gives no attack speed. E's first dash is left out; only
# the chain that pulls Sylas to the enemy is modelled. Q's lash and explosion
# hit together.
id: sylas
radius: 65
tags: [melee]
params:
  windup_pct: 0.25 # unverified
constants:
  q_lash: [40, 60, 80, 100, 120] # unverified
  q_explosion: [60, 115, 170, 225, 280] # unverified
  q_slow: [0.15, 0.2, 0.25, 0.3, 0.35] # unverified
  w_damage: [65, 100, 135, 170, 205] # unverified
  w_heal: [25, 50, 75, 100, 125] # unverified
  w_cost: [50, 60, 70, 80, 90] # Riot data
  e_damage: [80, 130, 180, 230, 280] # unverified
  e_knockup: 0.5 # unverified
rank_priority: [Q, W, E]
passives: [sylas_petricite_burst]

actions:
  - id: sylas_attack
    slot: A
    tags: [basic_attack]
    target: enemy
    range: attack_range
    lock_move: true
    cancel_on_move: true
    on_execute:
      - damage: { amount: ad, type: physical, tags: [basic_attack], crit: 1 }

  - id: sylas_q
    slot: Q
    tags: [ability]
    max_rank: 5
    target: point
    range: "@q_range"
    cast_time: 0.4 # unverified
    cooldown: "@q_cooldown[rank]"
    costs: { mana: 55 }
    lock_move: true
    on_execute:
      - area:
          center: point
          radius: 200 # unverified
          effects:
            - damage: { amount: "@q_lash[rank] + 0.4 * ap + @q_explosion[rank] + 0.9 * ap", type: magic, tags: [aoe] } # ratios unverified
            - slow: { amount: "@q_slow[rank]", duration: 1.5 }

  - id: sylas_w
    slot: W
    tags: [ability]
    max_rank: 5
    target: enemy
    range: "@w_range"
    cooldown: "@w_cooldown[rank]"
    costs: { mana: "@w_cost[rank]" }
    lock_move: true
    on_execute:
      - dash: { to: target, speed: 1800 } # unverified
      - damage: { amount: "@w_damage[rank] + 0.85 * ap", type: magic } # ratio unverified
      # Heals more the lower Sylas's health, doubling at or below 40% health.
      - heal: { to: source, amount: "(@w_heal[rank] + 0.4 * ap) * (1 + clamp((1 - hp_pct) / 0.6, 0, 1))" } # unverified

  - id: sylas_e
    slot: E
    tags: [ability]
    max_rank: 5
    target: point
    cast_time: 0.25
    cooldown: "@e_cooldown[rank]"
    costs: { mana: 65 }
    lock_move: true
    on_execute:
      - projectile:
          speed: 1600 # unverified
          radius: 60 # unverified
          range: 800 # unverified
          on_hit:
            - dash: { who: source, to: target, speed: 1800 }
            - damage: { amount: "@e_damage[rank] + 1.0 * ap", type: magic } # ratio unverified
            # Knock-up modelled as a stun.
            - stun: { duration: "@e_knockup" }

buffs:
  # After each ability, Sylas's next attack whirls his chains for area damage.
  - id: sylas_petricite_burst
    listeners:
      - on: ability_cast
        effects:
          - apply_buff: { buff: sylas_charge, to: source }
      - on: on_hit
        when: "buff.sylas_charge >= 1"
        effects:
          - area:
              center: target
              radius: 400 # unverified
              effects:
                - damage: { amount: "9 + 3 * level + 1.3 * ad + 0.25 * ap", type: magic, tags: [proc, aoe] } # unverified
          - remove_buff: { buff: sylas_charge, from: source }

  - id: sylas_charge
    duration: 4 # unverified

ai:
  attack: A
  build: [sorcerers_shoes, blasting_wand, amplifying_tome, amplifying_tome]
  rules:
    - { use: E, when: "distance < 750" }
    - { use: Q, when: "distance < 700" }
    - { use: W, when: "distance < 400" }
