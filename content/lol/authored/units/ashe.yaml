# Ashe. Base stats, growth and cooldowns come from generated/units.yaml.
# The per-rank ability numbers below are written by hand (League of Legends
# Wiki) until the ingest tool extracts them from Riot's data.
# Simplified: W is one arrow instead of a cone of them, crits use the normal
# crit rule instead of Frost Shot's, and E (Hawkshot) is left out.
id: ashe
radius: 65
tags: [ranged]
params:
  windup_pct: 0.2193
constants:
  attack_missile_speed: 2500
  frost_slow: 0.2
  q_attack_speed: [0.25, 0.325, 0.4, 0.475, 0.55]
  q_damage_amp: [0.05, 0.1, 0.15, 0.2, 0.25]
  w_damage: [20, 35, 50, 65, 80]
  w_cost: [75, 70, 65, 60, 55]
  r_damage: [200, 400, 600]
rank_priority: [W, Q]
passives: [ashe_frost_shot]

actions:
  - id: ashe_attack
    slot: A
    tags: [basic_attack]
    target: enemy
    range: attack_range
    lock_move: true
    cancel_on_move: true
    on_execute:
      - projectile:
          speed: "@attack_missile_speed"
          homing: true
          on_hit:
            - damage: { amount: ad, type: physical, tags: [basic_attack], crit: 1 }

  - id: ashe_q
    slot: Q
    tags: [ability]
    max_rank: 5
    costs: { mana: 30 }
    usable_when: "buff.ashe_focus >= 4"
    on_cast:
      - remove_buff: { buff: ashe_focus, from: source }
      - apply_buff: { buff: ashe_rangers_focus, to: source }

  - id: ashe_w
    slot: W
    tags: [ability]
    max_rank: 5
    target: point
    cast_time: 0.25
    cooldown: "@w_cooldown[rank]"
    costs: { mana: "@w_cost[rank]" }
    lock_move: true
    on_execute:
      - projectile:
          speed: 2000
          radius: 40
          range: "@w_range"
          on_hit:
            - damage: { amount: "@w_damage[rank] + ad", type: physical }
            - slow: { amount: "@frost_slow", duration: 2 }

  - id: ashe_r
    slot: R
    tags: [ability, ultimate]
    max_rank: 3
    target: point
    cast_time: 0.25
    cooldown: "@r_cooldown[rank]"
    costs: { mana: 100 }
    lock_move: true
    on_execute:
      - projectile:
          speed: 1600
          radius: 65
          range: "@r_range"
          on_hit:
            - damage: { amount: "@r_damage[rank] + 1.2 * ap", type: magic }
            # Longer flights stun for longer: 1 s up close, 3.5 s at 2800 units.
            - stun: { duration: "clamp(distance / 800, 1, 3.5)" }

buffs:
  - id: ashe_frost_shot
    listeners:
      - on: on_hit
        effects:
          - slow: { amount: "@frost_slow", duration: 2 }
          - apply_buff: { buff: ashe_focus, to: source }

  - id: ashe_focus
    duration: 4
    max_stacks: 4
    policy: add_stack

  - id: ashe_rangers_focus
    duration: 6
    modifiers:
      - { stat: attack_speed, value: "@q_attack_speed[rank]" }
      - { stat: damage_amp, value: "@q_damage_amp[rank]" }

ai:
  attack: A
  kite: true
  build: [berserkers_greaves, blade_of_the_ruined_king, dorans_blade, long_sword]
  rules:
    - { use: R, when: "distance < 1500" }
    - { use: Q }
    - { use: W, when: "distance < 1100" }
